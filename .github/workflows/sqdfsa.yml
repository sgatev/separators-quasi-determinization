name: Sqdfsa

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impl:
    name: Implementation (Bazel)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: impl
    env:
      # The sources are compiled with -Wall -Werror; use the compiler they are
      # developed with.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-impl
          repository-cache: true
      - name: Test
        run: bazel test -c opt --config=opt --test_output=errors //...
      - name: Build the benchmarks
        run: bazel build -c opt --config=opt //:main //:bench

  lean:
    name: Formalization (Lean)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for sorry
        run: |
          if grep -rnw sorry lean/Sqdfsa lean/Sqdfsa.lean; then
            echo "::error::The formalization contains sorry"
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true

  thesis:
    name: Thesis (LaTeX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: thesis
          root_file: main.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
      - name: Check references
        working-directory: thesis
        run: |
          if grep -nE "undefined (references|citations)|Reference .* undefined|Citation .* undefined" main.log; then
            echo "::error::The thesis has undefined references"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: thesis/main.pdf

  publish:
    name: Publish thesis PDF
    needs: thesis
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}thesis.pdf
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thesis
      # GitHub Pages serves the PDF inline, so that browsers display it.
      - name: Prepare the site
        run: |
          mkdir site
          cp main.pdf site/thesis.pdf
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=thesis.pdf">
          <title>Separators for Quasi-Determinization of Finite-State Devices</title>
          <a href="thesis.pdf">Thesis (PDF)</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Replace the thesis-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv main.pdf thesis.pdf
          gh release delete thesis-latest --yes --cleanup-tag || true
          gh release create thesis-latest thesis.pdf \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Thesis (latest build)" \
            --notes "Built by CI from $GITHUB_SHA."
